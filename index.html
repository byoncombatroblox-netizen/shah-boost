<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shah Boost</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 60px 20px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    p {
      color: #cbd5e1;
      font-size: 18px;
      margin-bottom: 30px;
    }

    .button {
      display: inline-block;
      padding: 14px 28px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-size: 17px;
    }

    .button:hover {
      background: #1d4ed8;
    }

    .box {
      margin-top: 40px;
      padding: 25px;
      background: #1f2937;
      border-radius: 15px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🚀 Shah Boost</h1>

    <p>
      Selamat datang ke website saya!
      Ini adalah website pertama saya.
    </p>

    <a class="button" href="#">
      Mula Sekarang
    </a>

    <div class="box">
      <h2>Website Saya</h2>
      <p>
        Dibina menggunakan HTML dan CSS.
      </p>
    </div>

  </div>

</body>
</html>
